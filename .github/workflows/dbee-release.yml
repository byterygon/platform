name: DBee release

# TSK-62: unsigned, offline installers of the DBee desktop app. Run it by hand (Actions > DBee
# release > Run workflow) or push a tag `v0.1.0` yourself; the workflow never creates a tag and
# never publishes: a tag push leaves a DRAFT release for a person to read and publish.
# The installers carry everything: nothing is downloaded when they install or when DBee runs.
# (The build itself fetches crates, npm packages and the WebView2 offline installer once.)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with the Tauri 2 line in Cargo.lock.
  TAURI_CLI_VERSION: "2.12.5"

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, bundles: dmg }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, bundles: dmg }
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf xdg-utils file
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @byterygon/dbee build
      - name: Third-party notices (Rust, npm, fonts, icons)
        run: node scripts/third-party-notices.mjs --out apps/dbee/desktop/THIRD-PARTY-NOTICES.txt
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Build the installers
        working-directory: apps/dbee/desktop
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.bundle.conf.json --ci
      - name: Collect the installers with their checksums
        run: |
          mkdir -p release
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release/ \;
          # The two macOS builds would otherwise share a name.
          if [ "${{ matrix.name }}" = "macos-x64" ]; then
            for f in release/*_x64.dmg release/*_x86_64.dmg; do [ -e "$f" ] && mv "$f" "${f%.dmg}-intel.dmg"; done
          fi
          ls -l release
          test -n "$(ls release)"
          (cd release && (sha256sum * 2>/dev/null || shasum -a 256 *) > "SHA256SUMS-${{ matrix.name }}")
          cat "release/SHA256SUMS-${{ matrix.name }}"
      # TSK-62 batch 3: the packaged app, not a debug build, starts with no network. The .deb is
      # installed (its WebKitGTK dependency is already on the runner), then the installed binary
      # does its cold start under Xvfb in a network namespace with only loopback.
      - name: Install the .deb and cold-start it offline (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xvfb
          sudo dpkg -i release/*.deb
          test -x /usr/bin/dbee-desktop
          test -f /usr/lib/DBee/LICENSE && test -f /usr/lib/DBee/THIRD-PARTY-NOTICES.txt
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$PATH" HOME="$HOME" DBEE_WORKSPACE="$1/dbee-workspace" DBEE_COLD_START_EXIT=1 \
              timeout 180 xvfb-run -a /usr/bin/dbee-desktop
          ' sh "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbee-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble the release
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # a draft release on a tag push; nothing is published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dbee-*
          path: release
          merge-multiple: true
      - name: Licence, notices, release notes and one checksum list
        run: |
          cp apps/dbee/LICENSE release/LICENSE
          node scripts/third-party-notices.mjs --out release/THIRD-PARTY-NOTICES.txt
          cp apps/dbee/RELEASE-NOTES-0.1.0.md release/RELEASE-NOTES.md
          cp apps/dbee/INSTALL.md release/INSTALL.md
          cd release
          cat SHA256SUMS-* | sort -k2 > SHA256SUMS
          rm SHA256SUMS-*
          sha256sum LICENSE THIRD-PARTY-NOTICES.txt INSTALL.md >> SHA256SUMS
          ls -l; cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbee-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Draft release (tag pushes only; a person publishes it)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "DBee ${GITHUB_REF_NAME#v}" --notes-file release/RELEASE-NOTES.md
