name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # TSK-122: debug info of the dev and test profiles is line tables only (file and line in
  # backtraces; no local variables for a debugger). The Rust cache was 4.4 GB and took 125 s at the
  # median to restore (TSK-120); full debug info is most of that and of the link time. A constant,
  # so rust-cache's key (which hashes CARGO_* variables) does not change from run to run, only once
  # when this line is added or changed. Release builds are not affected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# TSK-89: rust-cache saves on main only (`save-if`). Each Rust cache is 0.5 to 2.2 GB and the
# repository's cache is 10 GB, so caches saved by pull requests (usable by that pull request only)
# evicted main's, which every pull request restores from.

jobs:
  # TSK-89: what a pull request affects, from the real dependency graphs (scripts/affected.mjs:
  # pnpm packages, Cargo crates, Cargo.lock and pnpm-lock.yaml diffed per crate and package, the
  # JS-Rust edges of scripts/affected-rules.mjs). The jobs below switch on from its outputs and
  # scope their work (cargo -p, pnpm --filter). Pushes to main run everything. Every condition is
  # written `!= 'false'` and every argument has a run-everything default, so if this job fails the
  # others run in full (and "CI result" still fails).
  affected:
    name: Affected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all: ${{ steps.affected.outputs.all }}
      rust: ${{ steps.affected.outputs.rust }}
      typescript: ${{ steps.affected.outputs.typescript }}
      dbee_desktop: ${{ steps.affected.outputs.dbee_desktop }}
      dbee_budget: ${{ steps.affected.outputs.dbee_budget }}
      mightyconsole: ${{ steps.affected.outputs.mightyconsole }}
      cargo_args: ${{ steps.affected.outputs.cargo_args }}
      pnpm_select: ${{ steps.affected.outputs.pnpm_select }}
      pnpm_build_select: ${{ steps.affected.outputs.pnpm_build_select }}
      crate_list: ${{ steps.affected.outputs.crate_list }}
      package_list: ${{ steps.affected.outputs.package_list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The script's own tests, on this repository's real graphs. The cargo metadata cross-check
      # uses the runner's stable cargo (no toolchain install here); the pnpm one needs an install
      # and skips.
      - name: Test scripts/affected.mjs
        run: node --test scripts/affected.test.mjs
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Affected crates, packages and jobs
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/affected.mjs --event "$GITHUB_EVENT_NAME" ${BASE:+--base "$BASE"} --head HEAD --github-output --pretty > "$RUNNER_TEMP/affected.json"
          cat "$RUNNER_TEMP/affected.json"
          {
            echo '### Affected'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/affected.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TSK-89: the DBee UI (apps/dbee/ui/dist) is built once per run, here, and shared as an artifact
  # with every job that embeds it (Rust, the budget, Windows and macOS); the TypeScript job builds
  # every other package. It needs nothing, so it runs alongside the Affected job and the Rust job
  # waits for it as little as possible. Its build includes check-dist.
  dbee-ui:
    name: DBee UI build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@byterygon/dbee..."
      - run: pnpm --filter @byterygon/dbee build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbee-ui-dist
          path: apps/dbee/ui/dist
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust (fmt, clippy, test)
    needs: [affected, dbee-ui]
    if: ${{ !cancelled() && needs.affected.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # TSK-89: in the CI image (.github/ci-image), which has what this job used to install with apt
    # on every run: WebKitGTK and GTK 3 (ambidex-tauri links Tauri), PostgreSQL's binaries (the
    # driver, dbee-server and mightyconsole-server tests), Xvfb, Chrome and the Rust toolchain.
    # The options are explained in .github/ci-image/README.md (the user and the two capabilities
    # keep the network namespace steps below as they were on the host).
    container:
      image: ghcr.io/byterygon/ci-linux@sha256:f9905fe25d880d1f92bc1e25886db63b42f9bace8d5ff3bbb099a294e94f2bfd
      options: --user 1001 --cap-add SYS_ADMIN --cap-add NET_ADMIN --shm-size 2g
    env:
      # TSK-89: the affected crates as `-p a -p b ...`, or `--workspace`; read from the
      # environment (not interpolated into the scripts). Not named CARGO_*: rust-cache hashes those
      # variables into its key, and a key that changes with every pull request never restores.
      AFFECTED_CARGO_ARGS: ${{ needs.affected.outputs.cargo_args || '--workspace' }}
      AFFECTED_ALL: ${{ needs.affected.outputs.all }}
      AFFECTED_CRATES: ${{ needs.affected.outputs.crate_list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # DBee spec §2 (TSK-38): the desktop app embeds the built UI (apps/dbee/ui/dist), so the
      # bundle is in place before the Rust steps and the cold start below measures the real app.
      # TSK-89: the UI comes from the DBee UI build job (a missing artifact fails the job; the
      # placeholder page is never embedded silently); Node only for the Mightyconsole check.
      - if: ${{ needs.affected.outputs.dbee_desktop != 'false' }}
        name: The DBee UI built once in this run (apps/dbee/ui/dist)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dbee-ui-dist
          path: apps/dbee/ui/dist
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ needs.affected.outputs.mightyconsole != 'false' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.affected.outputs.mightyconsole != 'false' }}
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.affected.outputs.mightyconsole != 'false' }}
      - run: cargo fmt --all --check
      - run: cargo clippy $AFFECTED_CARGO_ARGS --all-targets --locked -- -D warnings
      - name: Build documentation
        run: cargo doc $AFFECTED_CARGO_ARGS --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo test $AFFECTED_CARGO_ARGS --locked
        env:
          BYTERYGON_REQUIRE_POSTGRES: "1"
          BYTERYGON_REQUIRE_WRITER_GATE: "1"
      # DBee spec §14 (TSK-38): the desktop app's cold start is measured on Linux. The real app
      # (WebKitGTK, the built UI) starts under Xvfb, prints the time from process start to the
      # core being ready, the window being ready and the first page load, and exits.
      - name: DBee desktop cold start (Xvfb)
        if: ${{ needs.affected.outputs.dbee_desktop != 'false' }}
        run: |
          cargo build -p dbee-desktop --locked
          DBEE_WORKSPACE="$RUNNER_TEMP/dbee-workspace" DBEE_COLD_START_EXIT=1 \
            timeout 180 xvfb-run -a target/debug/dbee-desktop
      # Ambidex spec §12: the conformance suite must pass on a network-disconnected runner. It
      # runs again in a fresh network namespace with only loopback, as the runner user, offline.
      # It includes the rpc-gen drift test (tests/codegen.rs), so this also shows that generation
      # needs no network and that the committed api.ts and api.manifest.json are current (spec §2).
      # Plugin Host runs under the same constraint. DBee spec §14 (TSK-38): the web shell's
      # end-to-end test runs here too: a server-issued session adds a connection, approves it,
      # runs a query and receives Arrow chunks over the WebSocket, against a throwaway PostgreSQL
      # on loopback, so the only reachable network is the approved database. Mightyconsole spec
      # §18 (TSK-79): the Mightyconsole server end to end (page session, upgrade checks, the tool
      # contract on the echo sample) runs here too, showing it opens no outbound connection.
      # Every crate was already downloaded by the steps above, so nothing is fetched here. The
      # script stops at the first failing command. TSK-89: each of the four runs when its crate is
      # affected (all four when everything runs or the affected job gave no answer).
      - name: Conformance suite (network disconnected)
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.crate_list), ' ambidex-conformance ') || contains(format(' {0} ', needs.affected.outputs.crate_list), ' plugin-host ') || contains(format(' {0} ', needs.affected.outputs.crate_list), ' dbee-server ') || contains(format(' {0} ', needs.affected.outputs.crate_list), ' mightyconsole-server ') }}
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            as_runner() {
              case "$4" in false) case " $5 " in *" $3 "*) ;; *) echo "$3: not affected"; return 0 ;; esac ;; esac
              setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
                env PATH="$1" HOME="$2" CARGO_TERM_COLOR=always BYTERYGON_REQUIRE_WRITER_GATE=1 \
                BYTERYGON_REQUIRE_POSTGRES=1 cargo test -p "$3" --locked --offline
            }
            as_runner "$1" "$2" ambidex-conformance "$3" "$4"
            as_runner "$1" "$2" plugin-host "$3" "$4"
            as_runner "$1" "$2" dbee-server "$3" "$4"
            as_runner "$1" "$2" mightyconsole-server "$3" "$4"
          ' sh "$PATH" "$HOME" "$AFFECTED_ALL" "$AFFECTED_CRATES"
      # Mightyconsole spec §18 (TSK-79): the real server serving the built UI, in Chrome, in a
      # network namespace with only loopback: the page's session (cookie, CSRF meta, Origin) and
      # CSP hold, a profile added in the UI connects and streams, a reload restores its tab, and
      # nothing is requested outside the server.
      - name: Mightyconsole in Chrome (network disconnected)
        if: ${{ needs.affected.outputs.mightyconsole != 'false' }}
        run: |
          cargo build -p mightyconsole-server --locked
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" BYTERYGON_REQUIRE_BROWSER=1 pnpm --filter @byterygon/mightyconsole check:browser
          ' sh "$PATH" "$HOME"

  dbee-desktop-budget:
    # DBee spec §1 performance budget on Linux (TSK-61): the desktop app on WebKitGTK under Xvfb,
    # release build, driven by apps/dbee/desktop/examples/acceptance through its own UI (bench
    # hook of TSK-39) against a throwaway PostgreSQL from the distribution's binaries with the
    # acceptance data (bench_rows 1M x 10, 10,000 tables). It reports; it fails only when a step
    # does not work (a budget over target is recorded in DOC-16, not enforced here).
    name: DBee desktop budget (Linux, WebKitGTK)
    needs: [affected, dbee-ui]
    if: ${{ !cancelled() && needs.affected.outputs.dbee_budget != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # TSK-89: in the CI image (WebKitGTK, PostgreSQL, Xvfb, the toolchain), like the Rust job.
    # WebKitGTK runs without its bubblewrap sandbox in a container (.github/ci-image/README.md).
    # No network namespace here, so no added capabilities.
    container:
      image: ghcr.io/byterygon/ci-linux@sha256:f9905fe25d880d1f92bc1e25886db63b42f9bace8d5ff3bbb099a294e94f2bfd
      options: --user 1001 --shm-size 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The DBee UI built once in this run (apps/dbee/ui/dist)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dbee-ui-dist
          path: apps/dbee/ui/dist
      # acceptance.sh summarises each run's report with node (no packages needed).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo build --release --locked -p dbee-desktop --bin dbee-desktop --example acceptance
      - name: Measure (3 runs)
        run: |
          apps/dbee/acceptance/local-postgres.sh start "$RUNNER_TEMP/pg" 55432
          status=0
          timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" \
            apps/dbee/acceptance/acceptance.sh perf --port 55432 --runs 3 --no-build --out "$RUNNER_TEMP/dbee-budget" || status=$?
          for f in "$RUNNER_TEMP"/dbee-budget/run-*.json; do echo "== $f"; cat "$f"; done
          apps/dbee/acceptance/local-postgres.sh stop "$RUNNER_TEMP/pg"
          exit "$status"

  typescript:
    # Must match the required status check in the protect-main ruleset; do not rename without updating it.
    name: TypeScript (typecheck)
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.typescript != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # TSK-89: the affected packages as `--filter a --filter b ...` (build: with their own
      # dependencies, `--filter a...`), or `--recursive`; read from the environment.
      PNPM_SELECT: ${{ needs.affected.outputs.pnpm_select || '--recursive' }}
      PNPM_BUILD_SELECT: ${{ needs.affected.outputs.pnpm_build_select || '--recursive' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runtime's integration tests run against the Rust conformance server
      # (ambidex-conformance, WebSocket feature only, so no WebKitGTK is needed).
      - name: Install toolchain from rust-toolchain.toml
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/ambidex ') }}
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/ambidex ') }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm $PNPM_SELECT run --if-present typecheck
      # TSK-89: the DBee UI is built once, by the DBee UI build job.
      - run: pnpm $PNPM_BUILD_SELECT --filter '!@byterygon/dbee' run --if-present build
      # Byterygon UI spec §9a.4 (TSK-50): the design-token lint rules (@byterygon/lint) on
      # packages/ui, packages/theme-studio, packages/data-grid and apps/dbee/ui. Needs the token engine built above.
      - run: pnpm $PNPM_SELECT run --if-present lint
      - run: pnpm $PNPM_SELECT run --if-present test
        env:
          AMBIDEX_REQUIRE_RUST_SERVER: "1"
      # Byterygon UI spec §4: the token build needs no network. Check the committed outputs and
      # run the package's tests (compiled by the step above) again in a network namespace with
      # only loopback, as the runner user. The script stops at the first failing command.
      - name: Design tokens (network disconnected)
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/design-tokens ') }}
        working-directory: packages/design-tokens
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            as_runner() {
              path="$1"; home="$2"; shift 2
              setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
                env PATH="$path" HOME="$home" "$@"
            }
            as_runner "$1" "$2" node bin/by-tokens.js build --check
            as_runner "$1" "$2" node --test ".test-build/test/**/*.test.js"
          ' sh "$PATH" "$HOME"
      # Byterygon UI spec §9a.5 (TSK-50): the MCP server (stdio only) answers every tool, reads the
      # registry and installs items into a project with no network. Same network namespace.
      - name: Byterygon UI MCP server (network disconnected)
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/ui-mcp ') }}
        working-directory: packages/mcp
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" node --test "test/**/*.test.js"
          ' sh "$PATH" "$HOME"
      # Byterygon UI spec §6 (TSK-42): the registry is current, and the real shadcn CLI installs it
      # offline, from the folder and from a loopback static server, into a blank Vite app whose
      # build resolves stock and Byterygon classes to the tokens. Same network namespace.
      - name: Byterygon UI registry install (network disconnected)
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/ui ') }}
        working-directory: packages/ui
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" sh -c "node scripts/registry.ts --check && node scripts/verify-install.ts"
          ' sh "$PATH" "$HOME"
      # TSK-46: the editors in a real browser (the runner's Chrome): Monaco loads on demand from the
      # app's own files with its worker, follows the tokens of every preset, mode and density at
      # run time, works by keyboard and with a 1 MB document. Same network namespace.
      - name: Byterygon UI editors in Chrome (network disconnected)
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/ui ') }}
        working-directory: packages/ui
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" BYTERYGON_REQUIRE_BROWSER=1 node scripts/browser-check.ts
          ' sh "$PATH" "$HOME"
      # TSK-48: the Theme Studio in the runner's Chrome, from file:// and a loopback server: no
      # request outside its own files, every preset's every export (downloaded through the Export
      # dialog) byte for byte what by-tokens prints, edits and storage. Same network namespace.
      - name: Theme Studio in Chrome (network disconnected)
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/theme-studio ') }}
        working-directory: packages/theme-studio
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" BYTERYGON_REQUIRE_BROWSER=1 node scripts/browser-check.ts
          ' sh "$PATH" "$HOME"
      # TSK-39: the data grid in the runner's Chrome: 1,000,000 x 10 rows streamed from a Worker while
      # the page scrolls; frame intervals and the grid's work are reported, the JS heap holds no
      # per-row objects, nothing leaves loopback. Headless pacing makes it a smoke test, not the
      # benchmark (the gate is not enforced). Same network namespace.
      - name: Data grid in Chrome (network disconnected)
        if: ${{ needs.affected.outputs.all != 'false' || contains(format(' {0} ', needs.affected.outputs.package_list), ' @byterygon/data-grid ') }}
        working-directory: packages/data-grid
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" BYTERYGON_REQUIRE_BROWSER=1 node scripts/frame-check.ts
          ' sh "$PATH" "$HOME"

  # TSK-62: the desktop app is built and tested on Windows and macOS too, so the cfg(windows)
  # Mica code (TSK-54) is compiled and linted in CI, not only on the one machine that has it.
  # The Linux job above also measures the cold start; here the UI is built first so the app
  # embeds it, then clippy and the crate's tests run on the native toolchain.
  desktop:
    name: DBee desktop (${{ matrix.os }})
    needs: [affected, dbee-ui]
    if: ${{ !cancelled() && needs.affected.outputs.dbee_desktop != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The DBee UI built once in this run (apps/dbee/ui/dist)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dbee-ui-dist
          path: apps/dbee/ui/dist
      - run: cargo clippy -p dbee-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p dbee-desktop --locked

  licenses:
    name: License policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: License fields and AGPL direction check
        run: node scripts/check-licenses.mjs
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # Update GITLEAKS_VERSION and this SHA-256 together, using the release's official
          # gitleaks_<version>_checksums.txt file before accepting a new archive.
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  # TSK-89: one check that sums up the run, for the protect-main ruleset: it fails when the
  # affected job failed or any other job failed or was cancelled; a job switched off by the
  # affected job (skipped) counts as passed.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [affected, dbee-ui, rust, dbee-desktop-budget, typescript, desktop, licenses, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            let ok = true;
            for (const [job, { result }] of Object.entries(needs)) {
              const fine = result === "success" || (result === "skipped" && job !== "affected");
              console.log(`${fine ? "ok  " : "FAIL"} ${job}: ${result}`);
              ok &&= fine;
            }
            process.exit(ok ? 0 : 1);
          '
