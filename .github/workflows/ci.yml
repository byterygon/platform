name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # ambidex-tauri links Tauri, which needs WebKitGTK (and GTK 3) on Linux. The PostgreSQL
      # driver tests start a throwaway server from the postgresql binaries.
      - name: Install system libraries and PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev postgresql
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          BYTERYGON_REQUIRE_POSTGRES: "1"
      # Ambidex spec §12: the conformance suite must pass on a network-disconnected runner. It
      # runs again in a fresh network namespace with only loopback, as the runner user, offline.
      # It includes the rpc-gen drift test (tests/codegen.rs), so this also shows that generation
      # needs no network and that the committed api.ts and api.manifest.json are current (spec §2).
      - name: Conformance suite (network disconnected)
        run: |
          sudo unshare --net -- sh -c '
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            exec setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" CARGO_TERM_COLOR=always \
              cargo test -p ambidex-conformance --locked --offline
          ' sh "$PATH" "$HOME"

  typescript:
    name: TypeScript (typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runtime's integration tests run against the Rust conformance server
      # (ambidex-conformance, WebSocket feature only, so no WebKitGTK is needed).
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          AMBIDEX_REQUIRE_RUST_SERVER: "1"

  licenses:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: License fields and AGPL direction check
        run: node scripts/check-licenses.mjs
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
