name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ambidex-tauri links Tauri, which needs WebKitGTK (and GTK 3) on Linux. The PostgreSQL
      # driver tests start a throwaway server from the postgresql binaries.
      - name: Install system libraries and PostgreSQL
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libwebkit2gtk-4.1-dev postgresql
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo test --workspace --locked
        env:
          BYTERYGON_REQUIRE_POSTGRES: "1"
          BYTERYGON_REQUIRE_WRITER_GATE: "1"
      # Ambidex spec §12: the conformance suite must pass on a network-disconnected runner. It
      # runs again in a fresh network namespace with only loopback, as the runner user, offline.
      # It includes the rpc-gen drift test (tests/codegen.rs), so this also shows that generation
      # needs no network and that the committed api.ts and api.manifest.json are current (spec §2).
      # Plugin Host runs under the same constraint. Every crate was already downloaded by the
      # steps above, so nothing is fetched here. The script stops at the first failing command.
      - name: Conformance suite (network disconnected)
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            as_runner() {
              setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
                env PATH="$1" HOME="$2" CARGO_TERM_COLOR=always BYTERYGON_REQUIRE_WRITER_GATE=1 \
                cargo test -p "$3" --locked --offline
            }
            as_runner "$1" "$2" ambidex-conformance
            as_runner "$1" "$2" plugin-host
          ' sh "$PATH" "$HOME"

  typescript:
    # Must match the required status check in the protect-main ruleset; do not rename without updating it.
    name: TypeScript (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runtime's integration tests run against the Rust conformance server
      # (ambidex-conformance, WebSocket feature only, so no WebKitGTK is needed).
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          AMBIDEX_REQUIRE_RUST_SERVER: "1"
      # Byterygon UI spec §4: the token build needs no network. Check the committed outputs and
      # run the package's tests (compiled by the step above) again in a network namespace with
      # only loopback, as the runner user. The script stops at the first failing command.
      - name: Design tokens (network disconnected)
        working-directory: packages/design-tokens
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            as_runner() {
              path="$1"; home="$2"; shift 2
              setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
                env PATH="$path" HOME="$home" "$@"
            }
            as_runner "$1" "$2" node bin/by-tokens.js build --check
            as_runner "$1" "$2" node --test ".test-build/test/**/*.test.js"
          ' sh "$PATH" "$HOME"
      # Byterygon UI spec §6 (TSK-42): the registry is current, and the real shadcn CLI installs it
      # offline, from the folder and from a loopback static server, into a blank Vite app whose
      # build resolves stock and Byterygon classes to the tokens. Same network namespace.
      - name: Byterygon UI registry install (network disconnected)
        working-directory: packages/ui
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" sh -c "node scripts/registry.ts --check && node scripts/verify-install.ts"
          ' sh "$PATH" "$HOME"
      # TSK-46: the editors in a real browser (the runner's Chrome): Monaco loads on demand from the
      # app's own files with its worker, follows the tokens of every preset, mode and density at
      # run time, works by keyboard and with a 1 MB document. Same network namespace.
      - name: Byterygon UI editors in Chrome (network disconnected)
        working-directory: packages/ui
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
              echo "network is reachable"; exit 1
            fi
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              env PATH="$1" HOME="$2" BYTERYGON_REQUIRE_BROWSER=1 node scripts/browser-check.ts
          ' sh "$PATH" "$HOME"

  licenses:
    name: License policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: License fields and AGPL direction check
        run: node scripts/check-licenses.mjs
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # Update GITLEAKS_VERSION and this SHA-256 together, using the release's official
          # gitleaks_<version>_checksums.txt file before accepting a new archive.
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
