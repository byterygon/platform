name: Mightyconsole lab

# The Mightyconsole test lab (TSK-79, spec section 14): every service starts healthy and seeded
# with one command, every port is on 127.0.0.1, LangGraph serves a run with no egress, and it all
# goes away again. Runs when the lab or the acceptance harness changes, weekly (pinned images and
# packages stay pullable), and by hand. Tool tasks add their integration tests against it here.
# TSK-87: the acceptance harness runs the foundation's checklist against the running lab and
# uploads its evidence (summary.md, logs, screenshots); TSK-84 adds LangGraph's.
# TSK-129: on a pull request the lab runs only with a lab label (scripts/lab-labels.mjs: `lab`,
# `lab:<tool>`, `lab:all`; `lab:none` runs nothing), when it is added and on each push while it
# stays. The "Lab decision" workflow fails a pull request that needs the lab and has no lab label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths: ["apps/mightyconsole/lab/**", "apps/mightyconsole/acceptance/**", "crates/message-codecs/**", ".github/workflows/mightyconsole-lab.yml", "scripts/affected*.mjs", "scripts/lab-labels.mjs"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # TSK-130: a push to main looks up the lab-pass marker of its tree (artifacts API).
  actions: read

env:
  # TSK-122: as in ci.yml, debug info is line tables only (smaller cache and faster links for the
  # acceptance harness's own `cargo build` and `cargo test`).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lab:
    name: Mightyconsole lab
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # TSK-89: a pull request brings up only the profiles of the tools whose own files changed
    # (scripts/affected.mjs, LAB_TOOL_FILES in scripts/affected-rules.mjs); any other Mightyconsole
    # change, a push, the weekly run and a manual run bring up every tool. The foundation checklist
    # needs every service, so it runs with every tool; a tool's checklist runs with its tool.
    # TSK-129: on a pull request, only when it carries a lab label (lab:none starts the job, which
    # then brings up nothing), and a label event only when the label added is a lab label.
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.action != 'labeled' || startsWith(github.event.label.name, 'lab')) &&
       (contains(github.event.pull_request.labels.*.name, 'lab') || contains(join(github.event.pull_request.labels.*.name, ' '), 'lab:')))
    # TSK-124: a newer push to the same pull request (or a newer main) cancels the run in progress,
    # like ci.yml. TSK-129: on the job, so a run that skips this job (a label that is not a lab
    # label, a push to a pull request without one) never cancels a lab run.
    concurrency:
      group: lab-${{ github.ref }}
      cancel-in-progress: true
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Affected tools
        id: tools
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/affected.mjs --event "$GITHUB_EVENT_NAME" ${BASE:+--base "$BASE"} --head HEAD --pretty > "$RUNNER_TEMP/affected.json"
          echo "affected: $(node -p 'const t = require(process.argv[1]).lab_tools; Array.isArray(t) ? t.join(" ") : t' "$RUNNER_TEMP/affected.json")"
          tools=$(node scripts/lab-labels.mjs scope --event "$GITHUB_EVENT_NAME" --labels "$LABELS" --affected "$RUNNER_TEMP/affected.json")
          echo "lab_tools: $tools (labels: $LABELS)"
          # TSK-130: the tested tree. A pull request whose lab passed with every tool leaves a
          # lab-pass-<tree> marker; squash-merging it (up to date with main, as the ruleset requires)
          # gives main that same tree, so a push to main finding the marker skips the repeat. The
          # weekly and manual runs always run.
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lab-pass-$tree" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' || true)
            if [ -n "$passed" ]; then
              tools=none
              echo "This tree ($tree) passed the lab with every tool on a pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$passed" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "lab_tools=$tools" >> "$GITHUB_OUTPUT"
          echo "### Lab tools: $tools" >> "$GITHUB_STEP_SUMMARY"
      - name: Images pinned and listed
        run: node apps/mightyconsole/lab/lab.mts images check
      # TSK-121: the runner's load every 15 s until the job ends (uptime, memory, the lab's
      # containers by CPU), kept with the evidence: do the browser checks that time out run on a
      # starved machine?
      - name: Load sampler
        run: |
          mkdir -p apps/mightyconsole/acceptance/evidence
          out="$PWD/apps/mightyconsole/acceptance/evidence/runner-load.log"
          echo "nproc $(nproc); $(free -m | sed -n 2p)" > "$out"
          nohup sh -c 'while true; do
            echo "== $(date -u +%T) $(cut -d" " -f1-3 /proc/loadavg) mem-used-MiB $(free -m | awk "/^Mem:/ {print \$3}")"
            docker stats --no-stream --format "{{.Name}} {{.CPUPerc}} {{.MemUsage}}" 2>/dev/null | sort -k2 -rn | head -5
            sleep 15
          done' >> "$out" 2>&1 &
      # TSK-149: before Up, so the build below can start; it reads only the tools.
      - name: Checklists to run
        id: checklists
        env:
          LAB_TOOLS: ${{ steps.tools.outputs.lab_tools }}
        run: |
          # The checklists CI runs against the lab: foundation (every service), LangGraph, the
          # messaging core (TSK-80; the kafka profile's Confluent Schema Registry) and Temporal
          # (TSK-83, TSK-92: the dev server and the lab worker), with every item of temporal-more
          # (TSK-92 wired all eight). NATS (TSK-85) runs only the items wired so far: each batch
          # adds the ids it wired to nats_only (TSK-139: stored-profile), and TSK-104 to detail
          # (temporal-detail). Security (DOC-25 section 6) runs with the idp profile (Dex): its
          # login items (TSK-136).
          # Which tool switches on which checklist is SWITCHES in scripts/lab-labels.mjs, which also adds
          # the tools those checklists need to a label's scope (TSK-154); a test compares the two.
          more=""
          detail=""
          nats_only=""
          case " $LAB_TOOLS " in
            " all ") lists="foundation langgraph messaging temporal security" ;;
            *)
              lists=""
              case " $LAB_TOOLS " in *" langgraph "*) lists="langgraph" ;; esac
              case " $LAB_TOOLS " in *" idp "*) lists="${lists:+$lists }security" ;; esac
              case " $LAB_TOOLS " in *" kafka "*) lists="${lists:+$lists }messaging" ;; esac
              case " $LAB_TOOLS " in *" temporal "*) lists="${lists:+$lists }temporal" ;; esac
              ;;
          esac
          case " $lists " in *" temporal "*) more="all"; detail="relations,schedule-detail" ;; esac
          case " $LAB_TOOLS " in " all "|*" nats "*) nats_only="stored-profile,connect,core,streams,consumers,kv-objects,services,schemas,audit" ;; esac
          echo "checklists: ${lists:-none}${more:+, temporal-more ($more)}${detail:+, temporal-detail ($detail)}${nats_only:+, nats ($nats_only)}"
          echo "lists=$lists" >> "$GITHUB_OUTPUT"
          echo "more=$more" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "nats=$nats_only" >> "$GITHUB_OUTPUT"
          # TSK-115: net-route's tests against the routes profile (squid, Dante, internal targets).
          routes=""
          case " $LAB_TOOLS " in " all "|*" routes "*) routes="1" ;; esac
          echo "routes=$routes" >> "$GITHUB_OUTPUT"
      - name: Install toolchain from rust-toolchain.toml
        if: ${{ steps.checklists.outputs.lists != '' || steps.checklists.outputs.nats != '' || steps.checklists.outputs.routes != '' }}
        run: rustup show active-toolchain || rustup toolchain install
      # TSK-148: restore only. The "Lab cache" workflow (lab-cache.yml) builds these targets on main
      # and saves this key (no job id in it, so both jobs share it); this job on main was almost
      # always skipped and never saved.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ steps.checklists.outputs.lists != '' || steps.checklists.outputs.nats != '' || steps.checklists.outputs.routes != '' }}
        with:
          key: mightyconsole-acceptance
          add-job-id-key: false
          save-if: false
      # TSK-149: the cargo targets of this run's checklists are built in the background while the lab
      # comes up, is checked and seeded (minutes of waiting on containers), under nice so the
      # containers keep the CPU first. Same environment as the Acceptance step (rust-cache exported
      # CARGO_INCREMENTAL above), so the checklists' cargo calls find everything built. The step
      # "Wait for the prebuild" ends it before the checklists start.
      - name: Prebuild in the background
        if: ${{ steps.checklists.outputs.lists != '' || steps.checklists.outputs.nats != '' || steps.checklists.outputs.routes != '' }}
        env:
          LISTS: ${{ steps.checklists.outputs.lists }}
          NATS: ${{ steps.checklists.outputs.nats != '' && 'nats' || '' }}
          ROUTES: ${{ steps.checklists.outputs.routes != '' && 'routes' || '' }}
        run: |
          log="$RUNNER_TEMP/prebuild.log"
          nohup sh -c 'log="$0"; nice -n 10 apps/mightyconsole/acceptance/prebuild.sh "$@" > "$log" 2>&1; echo $? > "$log.status"' "$log" $LISTS $NATS $ROUTES > /dev/null 2>&1 &
          echo "prebuild.sh $LISTS $NATS $ROUTES started, log in $log"
      # The tools as arguments ("all": none, which lab.mts reads as every tool).
      - name: Up
        if: ${{ steps.tools.outputs.lab_tools != 'none' }}
        env:
          LAB_TOOLS: ${{ steps.tools.outputs.lab_tools != 'all' && steps.tools.outputs.lab_tools || '' }}
        run: node apps/mightyconsole/lab/lab.mts up $LAB_TOOLS
      - name: Check
        if: ${{ steps.tools.outputs.lab_tools != 'none' }}
        env:
          LAB_TOOLS: ${{ steps.tools.outputs.lab_tools != 'all' && steps.tools.outputs.lab_tools || '' }}
        run: node apps/mightyconsole/lab/lab.mts check $LAB_TOOLS
      - name: Seeds are idempotent
        if: ${{ steps.tools.outputs.lab_tools != 'none' }}
        env:
          LAB_TOOLS: ${{ steps.tools.outputs.lab_tools != 'all' && steps.tools.outputs.lab_tools || '' }}
        run: |
          node apps/mightyconsole/lab/lab.mts seed $LAB_TOOLS
          node apps/mightyconsole/lab/lab.mts check $LAB_TOOLS
      - name: LangGraph with no egress
        if: ${{ steps.tools.outputs.lab_tools == 'all' || contains(format(' {0} ', steps.tools.outputs.lab_tools), ' langgraph ') }}
        run: node apps/mightyconsole/lab/lab.mts langgraph-offline
      # The lab came up, was checked and seeded (every step above passed): net-route's step below runs
      # only then (TSK-115, TSK-147).
      - name: Lab ready
        id: lab-ready
        if: ${{ steps.tools.outputs.lab_tools != 'none' }}
        run: echo "the lab is up"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ steps.checklists.outputs.lists != '' || steps.checklists.outputs.nats != '' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.checklists.outputs.lists != '' || steps.checklists.outputs.nats != '' }}
      # TSK-149: the background build ends here, before the checklists; its result is printed and kept
      # with the evidence. A failed prebuild fails nothing: the checklists build and report as before.
      - name: Wait for the prebuild
        if: ${{ steps.checklists.outputs.lists != '' || steps.checklists.outputs.nats != '' || steps.checklists.outputs.routes != '' }}
        timeout-minutes: 30
        run: |
          log="$RUNNER_TEMP/prebuild.log"
          start=$(date +%s)
          while [ ! -f "$log.status" ]; do sleep 5; done
          echo "waited $(( $(date +%s) - start )) s for prebuild.sh, exit $(cat "$log.status")"
          grep -E '^== |Finished|^error' "$log" || true
          if [ "$(cat "$log.status")" != 0 ]; then tail -50 "$log"; fi
          mkdir -p apps/mightyconsole/acceptance/evidence
          cp "$log" apps/mightyconsole/acceptance/evidence/prebuild.log
      # cargo-deny is not installed here (the CI job runs it), so that one check is skipped.
      - name: Acceptance (foundation, LangGraph, the messaging core, Temporal and NATS, against the lab)
        if: ${{ steps.checklists.outputs.lists != '' || steps.checklists.outputs.nats != '' }}
        env:
          BYTERYGON_REQUIRE_BROWSER: "1"
          # TSK-121: this job brought the lab up and checked it, so a checklist whose lab check
          # fails (after one more try) fails its items instead of skipping them.
          MIGHTYCONSOLE_LAB_REQUIRED: "1"
          LISTS: ${{ steps.checklists.outputs.lists }}
          MORE: ${{ steps.checklists.outputs.more }}
          DETAIL: ${{ steps.checklists.outputs.detail }}
          NATS_ONLY: ${{ steps.checklists.outputs.nats }}
        run: |
          status=0
          if [ -n "$LISTS" ]; then node apps/mightyconsole/acceptance/acceptance.mts $LISTS || status=$?; fi
          if [ -n "$MORE" ]; then node apps/mightyconsole/acceptance/acceptance.mts temporal-more || status=$?; fi
          if [ -n "$DETAIL" ]; then node apps/mightyconsole/acceptance/acceptance.mts temporal-detail --only "$DETAIL" || status=$?; fi
          if [ -n "$NATS_ONLY" ]; then node apps/mightyconsole/acceptance/acceptance.mts nats --only "$NATS_ONLY" || status=$?; fi
          cat apps/mightyconsole/acceptance/evidence/*/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # TSK-115, TSK-147 (approved by Uy Son 2026-11-26): after the checklists, and whether or not
      # they passed (the lab came up and was checked: the "Lab ready" step ran), so neither result
      # hides the other; either failing fails the job and withholds the lab-pass marker.
      - name: net-route through the lab's proxies (TSK-115)
        if: ${{ !cancelled() && steps.lab-ready.conclusion == 'success' && steps.checklists.outputs.routes != '' }}
        run: cargo test -p net-route --locked --features lab-tests --test lab
      # TSK-117: the tools through routes (Docker on routes-internal over TCP, TLS and SSH, Temporal
      # and LangGraph through squid, routes.test through two jump hosts); needs every tool up.
      - name: The tools through routes (TSK-117)
        if: ${{ !cancelled() && steps.lab-ready.conclusion == 'success' && steps.checklists.outputs.routes != '' && steps.tools.outputs.lab_tools == 'all' }}
        run: cargo test -p mightyconsole-server --locked --features lab-tests --test integration routes_lab -- --test-threads=2
      # TSK-130: the marker main looks for, only when every tool ran and every step passed.
      - name: Lab-pass marker
        if: ${{ success() && github.event_name == 'pull_request' && steps.tools.outputs.lab_tools == 'all' }}
        run: echo "run $GITHUB_RUN_ID passed the lab with every tool on tree ${{ steps.tools.outputs.tree }}" > "$RUNNER_TEMP/lab-pass.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() && github.event_name == 'pull_request' && steps.tools.outputs.lab_tools == 'all' }}
        with:
          name: lab-pass-${{ steps.tools.outputs.tree }}
          path: ${{ runner.temp }}/lab-pass.txt
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mightyconsole-acceptance-evidence
          path: apps/mightyconsole/acceptance/evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Logs on failure
        if: failure()
        run: docker compose -f apps/mightyconsole/lab/compose.yaml --profile all logs --tail 200
      - name: Down
        if: always()
        run: node apps/mightyconsole/lab/lab.mts down
