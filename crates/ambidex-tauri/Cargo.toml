[package]
name = "ambidex-tauri"
version = "0.0.0"
description = "Ambidex Tauri IPC transport and desktop session."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
# Lets the app's tauri-build find this plugin's permission files.
links = "tauri-plugin-ambidex"

[lints]
workspace = true

[dependencies]
ambidex = { path = "../ambidex" }
getrandom = "0.4.3"
security-types = { path = "../security-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "sync"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["test"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
