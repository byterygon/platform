[package]
name = "ambidex-conformance"
version = "0.0.0"
description = "Ambidex conformance suite: one set of protocol cases run on every transport."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["ws", "tauri"]
# WebSocket harness: the real axum server over rustls TLS on an ephemeral loopback port.
# With it, the sign-in cases (`oidc`): the OIDC routes against a test identity provider over TLS.
ws = [
    "dep:ambidex-axum",
    "dep:axum",
    "dep:base64",
    "dep:bytes",
    "dep:futures-util",
    "dep:getrandom",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:jsonwebtoken",
    "dep:rcgen",
    "dep:rustls",
    "dep:sha2",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
    "dep:url",
    "tokio/net",
]
# Tauri harness: the real plugin through Tauri's IPC and ACL layer on the mock runtime.
tauri = ["dep:ambidex-tauri", "dep:tauri"]
# The fixture's writer gate (`ambidex/test-hooks`) and the cases that hold frames with it. Not a
# default: only this crate's own tests enable it (the dev-dependency below), so a normal build of
# the workspace never has `ServerConfig::writer_gate`.
writer-gate = ["ambidex/test-hooks"]

# `rpc-gen` writes the fixture API's `api.ts` and `api.manifest.json` for the TypeScript client's
# conformance scenarios (Ambidex spec §2, §12). It needs no transport.
[[bin]]
name = "rpc-gen"
path = "src/bin/rpc-gen.rs"

# `conformance-server` serves the fixture API over the real WebSocket transport for the
# TypeScript client's integration tests (packages/ambidex/test/integration.test.ts).
[[bin]]
name = "conformance-server"
path = "src/bin/conformance-server.rs"
required-features = ["ws"]

[dependencies]
ambidex = { path = "../ambidex", features = ["arrow"] }
arrow-array = { version = "60.1.0", default-features = false }
arrow-buffer = { version = "60.1.0", default-features = false }
arrow-ipc = { version = "60.1.0", default-features = false }
arrow-schema = { version = "60.1.0", default-features = false }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
security-types = { path = "../security-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }

ambidex-axum = { path = "../ambidex-axum", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio", "ws"], optional = true }
base64 = { version = "0.22.1", default-features = false, features = ["std"], optional = true }
bytes = { version = "1.12.1", optional = true }
getrandom = { version = "0.4.3", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.12.0", features = ["client", "http1", "server"], optional = true }
hyper-util = { version = "0.1.21", features = ["http1", "server", "service", "tokio"], optional = true }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"], optional = true }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sha2 = { version = "0.11", optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"], optional = true }
url = { version = "2.5.8", optional = true }

ambidex-tauri = { path = "../ambidex-tauri", optional = true }
tauri = { version = "2.12.5", default-features = false, features = ["test"], optional = true }

[dev-dependencies]
# The suite's tests run every case, the writer-gate ones included.
# `default-features = false`: the harness features stay the ones the test run asks for, so
# `--no-default-features --features ws` builds no Tauri (and no GTK on Linux).
ambidex-conformance = { path = ".", default-features = false, features = ["writer-gate"] }
