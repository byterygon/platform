[package]
name = "ambidex"
version = "0.0.0"
description = "Ambidex: dual-transport RPC protocol engine."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ambidex-macros = { path = "../ambidex-macros" }
getrandom = "0.4.3"
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
security-types = { path = "../security-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "macros", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
