[package]
name = "audit-jsonl"
version = "0.1.0"
description = "The durable audit sink shared by DBee and Mightyconsole: hash-chained JSON Lines on the security-types v1 record, one fsync per entry, the chain verified on open, and verify."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The checkpoint's HMAC-SHA-256 (DOC-25 §3.5.4).
hmac = "0.13.0"
security-types = { path = "../security-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
zeroize = "1.9.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
zeroize = "1.9.1"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
