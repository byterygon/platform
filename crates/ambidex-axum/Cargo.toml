[package]
name = "ambidex-axum"
version = "0.0.0"
description = "Ambidex: WebSocket transport on axum, served over rustls TLS."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ambidex = { path = "../ambidex" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "service", "tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
security-types = { path = "../security-types" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
