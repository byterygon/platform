[workspace]
members = ["semantic-derive"]

[package]
name = "ambidex-cbor-spike"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
schemars = { version = "=1.2.3", features = ["derive"] }

ambidex = { path = "../../../crates/ambidex" }
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
semantic-derive = { path = "semantic-derive" }
ciborium = "=0.2.2"
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros", "time"] }
