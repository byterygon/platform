# The namespace `lab` of the test lab (TSK-82). Images pinned by digest.
apiVersion: v1
kind: Namespace
metadata: { name: lab }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: shop-config, namespace: lab }
data:
  currency: EUR
  features.json: '{"checkout": true, "wishlist": false}'
---
apiVersion: v1
kind: Secret
metadata: { name: shop-db, namespace: lab }
type: Opaque
stringData:
  username: shop
  password: lab-only-not-a-secret
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: lab, labels: { app: web } }
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo web > /www/index.html && httpd -f -p 8080 -h /www"]
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: shop-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: lab }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: lab }
spec:
  rules:
    - host: shop.lab.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: lab }
spec:
  clusterIP: None
  selector: { app: db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db, namespace: lab }
spec:
  serviceName: db
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers:
        - name: db
          image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "while true; do echo 'db: checkpoint complete'; sleep 10; done"]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-db, key: password } }
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-agent, namespace: lab }
spec:
  selector: { matchLabels: { app: node-agent } }
  template:
    metadata: { labels: { app: node-agent } }
    spec:
      containers:
        - name: agent
          image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "while true; do echo 'agent: node ok'; sleep 30; done"]
---
apiVersion: batch/v1
kind: Job
metadata: { name: migrate, namespace: lab }
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo 'migration 1 applied'; echo 'migration 2 applied'"]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: report, namespace: lab }
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
              command: ["sh", "-c", "echo 'report sent'"]
---
apiVersion: v1
kind: Pod
metadata: { name: crashloop, namespace: lab, labels: { app: crashloop } }
spec:
  containers:
    - name: crash
      image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "echo 'starting'; echo 'fatal: config missing' >&2; sleep 2; exit 1"]
---
apiVersion: v1
kind: Pod
metadata: { name: colourful, namespace: lab, labels: { app: colourful } }
spec:
  containers:
    - name: logger
      image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command:
        - sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))
            printf '\033[32mINFO\033[0m request %d served\n' "$i"
            printf '\033[1;33mWARN\033[0m slow response %d\n' "$i"
            printf '\033[31mERROR\033[0m \033[4mupstream\033[0m timeout %d\n' "$i" >&2
            sleep 1
          done
---
apiVersion: lab.byterygon.dev/v1
kind: Widget
metadata: { name: blue-small, namespace: lab }
spec: { colour: blue, size: 1 }
---
apiVersion: lab.byterygon.dev/v1
kind: Widget
metadata: { name: red-large, namespace: lab }
spec: { colour: red, size: 9 }
