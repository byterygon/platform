# The Mightyconsole test lab (TSK-79, Mightyconsole spec section 14). Use it through lab.mts:
#
#   pnpm --filter @byterygon/mightyconsole lab up [nats kafka k8s temporal docker langgraph]
#   pnpm --filter @byterygon/mightyconsole lab check
#   pnpm --filter @byterygon/mightyconsole lab down
#
# One compose profile per tool and `all`. Every published port is bound to 127.0.0.1. Every
# pulled image is pinned by digest (images.lock lists them); the built images pin their base by
# digest and their Python packages by hash. Credentials, keys and certificates are generated by
# `lab up` into the git-ignored .generated/. Lab only: nothing here is shipped.
name: mightyconsole-lab

x-tools: &tools
  image: mightyconsole-lab-tools:local
  build: { context: ., dockerfile: tools/Dockerfile }
  user: "${LAB_UID:-0}:${LAB_GID:-0}"
  volumes: ["./.generated:/generated"]
  restart: unless-stopped

services:
  # `lab up` runs it for `generate`, `seed` and `check`; it is never started on its own.
  tools:
    <<: *tools
    restart: "no"
    profiles: [tools]

  nats:
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    command: ["-c", "/generated/nats.conf"]
    volumes: ["./.generated:/generated:ro", "nats-data:/data"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      retries: 30
    profiles: [nats, all]

  # Token and `.creds` (operator mode) authentication, each on a server of its own (TSK-85).
  nats-token:
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    command: ["-c", "/generated/nats-token.conf"]
    volumes: ["./.generated:/generated:ro"]
    ports: ["127.0.0.1:4223:4223"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      retries: 30
    profiles: [nats, all]

  nats-jwt:
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    command: ["-c", "/generated/nats-jwt.conf"]
    volumes: ["./.generated:/generated:ro"]
    ports: ["127.0.0.1:4224:4224"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      retries: 30
    profiles: [nats, all]

  nats-echo:
    <<: *tools
    command: ["nats-echo"]
    depends_on: { nats: { condition: service_healthy } }
    profiles: [nats, all]

  kafka:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      CLUSTER_ID: bXlnaHR5Y29uc29sZWxhYg
    volumes: ["./.generated/kafka:/mnt/shared/config:ro", "./.generated:/generated:ro", "kafka-data:/var/lib/kafka/data"]
    ports: ["127.0.0.1:9092:9092", "127.0.0.1:9093:9093", "127.0.0.1:9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30
    profiles: [kafka, all]

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0@sha256:385c157f9cef42aa65e5c95050d85a439bcb0c897826aeabb3e10d36127ea223
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
    ports: ["127.0.0.1:8081:8081"]
    depends_on: { kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects >/dev/null"]
      interval: 3s
      retries: 40
    profiles: [kafka, all]

  kafka-member:
    <<: *tools
    command: ["kafka-member"]
    depends_on: { kafka: { condition: service_healthy } }
    profiles: [kafka, all]

  k3s:
    image: rancher/k3s:v1.34.1-k3s1@sha256:5e0707cfd1239b358ef73f3254bc3eadc027dd30cd5ec6ca41e29e47652a1b8c
    command: ["server", "--disable=traefik", "--disable=metrics-server", "--tls-san=127.0.0.1", "--write-kubeconfig=/output/kubeconfig.yaml", "--write-kubeconfig-mode=644"]
    privileged: true
    tmpfs: ["/run", "/var/run"]
    volumes: ["k3s-data:/var/lib/rancher/k3s", "k3s-output:/output", "./k8s:/lab-seed:ro"]
    ports: ["127.0.0.1:6443:6443"]
    healthcheck:
      test: ["CMD-SHELL", "kubectl get --raw /readyz >/dev/null 2>&1"]
      interval: 3s
      retries: 60
    profiles: [k8s, all]

  temporal:
    image: temporalio/temporal:1.10.1@sha256:b228dadf9cdb6c7c02a1394b89dd76f827aac9760e458fce42f0899a10141225
    # OrderId: a custom search attribute (TSK-94), so the query's suggestions show built-in and
    # custom attributes; the worker's samples carry it.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless", "--namespace", "lab", "--search-attribute", "OrderId=Keyword"]
    ports: ["127.0.0.1:7233:7233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      retries: 30
    profiles: [temporal, all]

  # The S3 store of Temporal External Storage (TSK-103). SeaweedFS (Apache-2.0): MinIO no longer
  # publishes images. Identities from .generated/seaweedfs/s3.json: read-write and read-only.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=64", "-volume.max=8", "-s3", "-s3.port=8333", "-s3.config=/generated/seaweedfs/s3.json"]
    volumes: ["./.generated:/generated:ro", "seaweedfs-data:/data"]
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 2s
      retries: 60
    profiles: [temporal, all]

  # The lab's payload codec server (TSK-92): AES-GCM, Temporal's codec-server protocol.
  temporal-codec:
    <<: *tools
    command: ["temporal-codec"]
    ports: ["127.0.0.1:8234:8234"]
    profiles: [temporal, all]

  temporal-worker:
    <<: *tools
    command: ["temporal-worker"]
    depends_on: { temporal: { condition: service_healthy }, seaweedfs: { condition: service_healthy } }
    profiles: [temporal, all]

  docker-host:
    image: mightyconsole-lab-docker-host:local
    build: { context: docker-host }
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    # TSK-116: the API on 2376 (TLS, client certificates) and 2375 (no TLS), and a copy of the socket
    # in .generated/docker-socket for the local socket transport; on routes-internal for TSK-117.
    volumes: ["./.generated:/generated:ro", "./.generated/docker-socket:/run/lab-docker", "docker-host-data:/var/lib/docker"]
    networks:
      default: {}
      routes-internal: { aliases: [docker.routes.internal] }
    ports: ["127.0.0.1:2222:22", "127.0.0.1:2375:2375", "127.0.0.1:2376:2376"]
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 && pgrep sshd >/dev/null && test -S /run/lab-docker/docker.sock && docker -H tcp://127.0.0.1:2375 version >/dev/null 2>&1 && docker -H tcp://localhost:2376 --tlsverify --tlscacert /generated/docker-tcp/ca.pem --tlscert /generated/docker-tcp/client.pem --tlskey /generated/docker-tcp/client-key.pem version >/dev/null 2>&1"]
      interval: 2s
      retries: 60
    profiles: [docker, all]

  langgraph:
    image: mightyconsole-lab-langgraph:local
    build: { context: langgraph }
    ports: ["127.0.0.1:2024:2024"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2024/ok', timeout=2)"]
      interval: 2s
      retries: 60
    profiles: [langgraph, all]

  # The identity provider for sign-in (TSK-136, DOC-25): Dex over TLS with its own CA, fixed
  # users and groups, one confidential client; everything generated into .generated/idp/.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/generated/idp/config.yaml"]
    volumes: ["./.generated:/generated:ro"]
    ports: ["127.0.0.1:5556:5556"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5558/healthz/ready"]
      interval: 2s
      retries: 60
    profiles: [idp, all]

  # Connection routes (TSK-115, DOC-23 section 12): the proxies publish their ports on 127.0.0.1
  # and also sit on routes-internal, a network with no way out and no published port, where the
  # targets live; only a route reaches them. Logins and the TLS certificate are in .generated/routes/.
  routes-squid:
    image: mightyconsole-lab-routes:local
    build: { context: routes }
    command: ["squid"]
    volumes: ["./.generated:/generated:ro"]
    networks: [default, routes-internal]
    ports: ["127.0.0.1:3128:3128", "127.0.0.1:3129:3129"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128 && nc -z 127.0.0.1 3129"]
      interval: 2s
      retries: 30
    profiles: [routes, all]

  routes-socks:
    image: mightyconsole-lab-routes:local
    build: { context: routes }
    command: ["socks"]
    volumes: ["./.generated:/generated:ro"]
    networks: [default, routes-internal]
    ports: ["127.0.0.1:1080:1080"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080"]
      interval: 2s
      retries: 30
    profiles: [routes, all]

  # Jump hosts (TSK-115 batch 2): jump1 is published and on the internal network, jump2 only on
  # the internal network (reached through jump1, or through a proxy).
  routes-jump1:
    image: mightyconsole-lab-routes:local
    build: { context: routes }
    command: ["jump"]
    volumes: ["./.generated:/generated:ro"]
    networks:
      default: {}
      routes-internal: { aliases: [jump1.routes.internal] }
    ports: ["127.0.0.1:2223:22"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 30
    profiles: [routes, all]

  routes-jump2:
    image: mightyconsole-lab-routes:local
    build: { context: routes }
    command: ["jump"]
    volumes: ["./.generated:/generated:ro"]
    networks:
      routes-internal: { aliases: [jump2.routes.internal] }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 30
    profiles: [routes, all]

  routes-echo:
    image: mightyconsole-lab-routes:local
    build: { context: routes }
    command: ["echo"]
    networks:
      routes-internal: { aliases: [echo.routes.internal] }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7 && nc -z 127.0.0.1 8080"]
      interval: 2s
      retries: 30
    profiles: [routes, all]

  routes-nats:
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    command: ["-p", "4222", "-m", "8222"]
    networks:
      routes-internal: { aliases: [nats.routes.internal] }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      retries: 30
    profiles: [routes, all]

networks:
  default: {}
  # TSK-115: the targets of the routes profile; no route out, nothing published.
  routes-internal:
    internal: true

volumes:
  seaweedfs-data: {}
  nats-data: {}
  kafka-data: {}
  k3s-data: {}
  k3s-output: {}
  docker-host-data: {}
