[package]
name = "mightyconsole-server"
version = "0.1.0"
description = "Mightyconsole web server: axum + ambidex-axum at /rpc/ws on 127.0.0.1 over rustls TLS (a self-signed certificate made on first start), the local browser session, the tool contract (live handles per connection, terminals, stream progress) and the static UI."
license = "AGPL-3.0-only"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Compile the built UI (apps/mightyconsole/ui/dist, or $MIGHTYCONSOLE_UI_DIST) into the binary:
# the release build (TSK-87, build.rs). Off for development and tests.
embed-ui = []
# Integration tests against the test lab (apps/mightyconsole/lab; `lab up <tool>` first). The
# acceptance harness turns it on; plain `cargo test` leaves those tests out.
lab-tests = []

[[bin]]
name = "mightyconsole-server"
path = "src/main.rs"

[dependencies]
ambidex = { path = "../../../crates/ambidex", features = ["arrow"] }
ambidex-axum = { path = "../../../crates/ambidex-axum" }
# NATS (spec §6.6): core, headers, request-reply, JetStream, KV, Object Store; rustls with ring, as the
# server's own listener. No websockets transport.
async-nats = { version = "=0.52.0", default-features = false, features = ["ring", "jetstream", "kv", "object-store", "nkeys", "crypto", "service", "nuid", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
arrow-array = { version = "60.1.0", default-features = false }
arrow-schema = { version = "60.1.0", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bytes = "1.12.1"
dirs = "7.0.0"
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
message-codecs = { path = "../../../crates/message-codecs", features = ["codegen"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.6"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
security-types = { path = "../../../crates/security-types", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting"] }
tokio = { version = "1.54.1", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
tonic = { version = "0.14.9", default-features = false, features = ["transport", "tls-ring", "tls-native-roots", "codegen"] }
tonic-prost = "0.14.9"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
url = "2.5.8"

[dev-dependencies]
arrow-ipc = { version = "60.1.0", default-features = false }
arrow-select = { version = "60.1.0", default-features = false }
ambidex-conformance = { path = "../../../crates/ambidex-conformance", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "process", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"
