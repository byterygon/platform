# cargo-deny policy. See ADR "Repository layout and licensing" (Notion DOC-10).
# Libraries are MIT OR Apache-2.0 and may only use permissive dependencies.
# AGPL-3.0 is allowed only for the product crates listed under `exceptions`;
# scripts/check-licenses.mjs additionally fails if a permissive crate depends on one of them.

[graph]
all-features = true

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { crate = "dbee", allow = ["AGPL-3.0-only"] },
    # MPL-2.0 (file-level copyleft) crates that Tauri itself requires (tauri-utils, dirs), pulled
    # in by ambidex-tauri. Accepted per crate by Uy Son on 2026-10-27 (Ambidex spec Open
    # question 19a); MPL-2.0 is not allowed globally.
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
