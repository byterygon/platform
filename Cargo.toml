[workspace]
resolver = "3"
members = [
    "crates/security-types",
    "crates/ambidex",
    "crates/ambidex-macros",
    "crates/ambidex-axum",
    "crates/ambidex-tauri",
    "crates/ambidex-conformance",
    "crates/ambidex-bench",
    "crates/plugin-host",
    "crates/db-driver",
    "crates/db-driver-postgres",
    "crates/message-codecs",
    "crates/audit-jsonl",
    "crates/net-route",
    "apps/dbee/core",
    "apps/dbee/rpc-gen",
    "apps/dbee/server",
    "apps/dbee/desktop",
    "apps/mightyconsole/server",
    "apps/mightyconsole/rpc-gen",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/byterygon/platform"

# Argon2id at DOC-25's parameters (19 MiB) takes seconds unoptimised, and every server test
# start hashes the default administrator's password (TSK-142): optimise the hash in test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Large records cross the wire in tests (a 64 MiB personal quota in 4 MiB profiles, TSK-156):
# optimise the crates that walk them byte by byte (JSON, base64, the call digest, the store, the
# protocol and its test client). Generic code runs at the opt-level of the crate that uses it, so
# `ambidex` is listed for the serde_json it instantiates; the server's own uses stay unoptimised.
[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.data-encoding]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.redb]
opt-level = 3

[profile.dev.package.ambidex]
opt-level = 3

[profile.dev.package.ambidex-conformance]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
